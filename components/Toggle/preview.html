<!-- @dsCard group="Actions" height=340 subtitle="Switches and checkboxes" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=DM+Mono&display=swap">
<style>
  body { margin: 0; }
  .stage { box-sizing: border-box; min-height: 100dvh; padding: 32px; }
  .stage { display: grid; align-content: center; justify-items: start; padding-left: 48px; }
  .panel { width: min(380px, 100%); padding: 8px 22px; display: grid; }
  .panel > * { padding: 15px 0; }
  .panel > * + * { border-top: 1px solid var(--hairline); }
  .check-row { display: flex; align-items: center; gap: 12px; font: 600 16px/1.4 var(--font-sans); }
</style>
</head>
<body>
<div class="shore stage">
  <div class="glass panel">
    <label class="toggle-row" for="t1">Light theme<input class="switch" type="checkbox" role="switch" id="t1" checked></label>
    <label class="toggle-row" for="t2">Email updates<input class="switch" type="checkbox" role="switch" id="t2"></label>
    <label class="check-row" for="c1"><input class="check" type="checkbox" id="c1" checked>Show on portfolio</label>
    <label class="check-row" for="c2"><input class="check" type="checkbox" id="c2">Allow comments</label>
  </div>
</div>
</body>
</html>
