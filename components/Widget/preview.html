<!-- @dsCard group="Surfaces" height=420 subtitle="Sea-glass tiles in a bento grid" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=DM+Mono&display=swap">
<style>
  body { margin: 0; }
  .stage { box-sizing: border-box; min-height: 100dvh; padding: 32px; }
  .stage { display: grid; align-content: center; justify-items: start; padding-left: 48px; }
  .bento { display: grid; grid-template-columns: 168px 168px 168px; grid-template-rows: 168px 168px; gap: 16px; }
  .bento .widget { width: auto; aspect-ratio: auto; }
  .wide { grid-column: 1 / 3; flex-direction: row !important; align-items: center; gap: 24px; }
  .wide .stack { display: grid; gap: 6px; }
  .tall { grid-row: 1 / 3; grid-column: 3; }
  @media (max-width: 640px) { .stage { padding-left: 20px; } .bento { grid-template-columns: 1fr 1fr; grid-template-rows: auto; } .wide { grid-column: 1 / -1; } .tall { grid-row: auto; grid-column: auto; } .bento .widget { min-height: 150px; } }
</style>
</head>
<body>
<div class="shore stage">
  <div class="bento">
    <div class="sg-tile sg-seafoam widget wide">
      <svg width="112" height="112" viewBox="0 0 88 88" aria-hidden="true"><circle class="ring-track" cx="44" cy="44" r="36" stroke-width="9"/><circle class="ring-value" cx="44" cy="44" r="36" stroke-width="9" stroke-dasharray="145.8 226.2" transform="rotate(-90 44 44)"/></svg>
      <div class="stack"><span class="widget-label">Focus today</span><span class="widget-value">7 h 40 m</span><span class="widget-sub">of a 12 hour goal</span></div>
    </div>
    <div class="sg-tile sg-cobalt widget tall">
      <span class="widget-label">Next</span>
      <span class="widget-value">14:00</span>
      <span class="widget-sub">Design review with the portfolio group, 45 minutes</span>
    </div>
    <div class="sg-tile sg-amber widget">
      <span class="widget-label">Visitors</span>
      <span class="widget-value">1,284</span>
      <span class="widget-sub">This week</span>
    </div>
    <div class="sg-tile sg-frost widget">
      <span class="widget-label">Streak</span>
      <span class="widget-value">9 days</span>
      <span class="widget-sub">Writing</span>
    </div>
  </div>
</div>
</body>
</html>
