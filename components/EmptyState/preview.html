<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=DM+Mono&display=swap">
<style>
  body { margin: 0; }
  .stage { box-sizing: border-box; min-height: 100dvh; padding: 32px; }
  .stage { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; align-items: start; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  @media (max-width: 640px) { .stage { grid-template-columns: 1fr; padding: 20px; } }
</style>
</head>
<body>
<div class="shore stage">
  <section class="glass" aria-labelledby="e1">
    <div class="empty">
      <span class="empty-icon pebble sg-frost"><svg class="icon" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 012-2h4l2 2h7a2 2 0 012 2v8a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></svg></span>
      <h2 class="empty-title" id="e1">No projects yet</h2>
      <p class="empty-text">Projects you create appear here, newest first.</p>
      <div class="row"><button class="btn btn-primary">Start a project</button><button class="btn btn-ghost">Import a folder</button></div>
    </div>
  </section>
  <section class="glass" aria-labelledby="e2">
    <div class="empty">
      <span class="empty-icon pebble sg-frost"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
      <h2 class="empty-title" id="e2">No matches for “tide”</h2>
      <p class="empty-text">Check the spelling, or search for one word instead of a phrase.</p>
      <button class="btn btn-sm">Clear search</button>
    </div>
  </section>
</div>
</body>
</html>
