<!-- @dsCard group="Feedback" height=380 subtitle="Strong frosted dialog over a scrim" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=DM+Mono&display=swap">
<style>
  body { margin: 0; }
  .stage { box-sizing: border-box; min-height: 100dvh; padding: 32px; }
  .stage { position: relative; overflow: hidden; }
  .scrim { position: absolute; }
  .behind { display: flex; flex-wrap: wrap; gap: 16px; }
  .behind span { width: 140px; height: 56px; }
</style>
</head>
<body>
<div class="shore stage">
  <div class="behind" aria-hidden="true"><span class="pebble sg-seafoam"></span><span class="pebble sg-cobalt"></span><span class="pebble sg-amber"></span><span class="pebble sg-lavender"></span></div>
  <div class="scrim">
    <div class="glass glass-strong modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <h2 class="modal-title" id="m-title">Delete this project?</h2>
      <p class="modal-body">Tide journal and its 12 pages will be removed. This cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost">Cancel</button>
        <button class="btn btn-danger">Delete project</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
