<!-- @dsCard group="Surfaces" height=460 subtitle="Sea-glass pebbles in every hue, and a frosted panel" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=DM+Mono&display=swap">
<style>
  body { margin: 0; }
  .stage { box-sizing: border-box; min-height: 100dvh; padding: 32px; }
  .stage { display: grid; grid-template-columns: 1fr 1.1fr; gap: 28px; align-items: center; }
  .stones { display: flex; flex-wrap: wrap; gap: 14px; }
  .stones { position: relative; }
  .rock { position: absolute; z-index: -1; border-radius: 999px; }
  .stone { display: grid; place-items: center; min-width: 108px; height: 56px; padding: 0 20px; box-sizing: border-box; font: 700 16px/1.2 var(--font-sans); }
  .card { padding: 24px; display: grid; gap: 14px; }
  .card h2 { margin: 0; font: 700 28px/1.2 var(--font-sans); letter-spacing: -0.01em; }
  .card p { margin: 0; font: 500 16px/1.6 var(--font-sans); color: var(--ink-muted); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  @media (max-width: 640px) { .stage { grid-template-columns: 1fr; padding: 20px; } }
</style>
</head>
<body>
<div class="shore stage">
  <div class="stones">
    <span class="rock" style="left: 30%; top: 22%; width: 46%; height: 34%; background: var(--cobalt-rim)" aria-hidden="true"></span>
    <span class="rock" style="left: 8%; top: 58%; width: 38%; height: 26%; background: var(--amber-rim)" aria-hidden="true"></span>
    <span class="pebble sg-frost stone">Frost</span>
    <span class="pebble sg-seafoam stone">Seafoam</span>
    <span class="pebble sg-aqua stone">Aqua</span>
    <span class="pebble sg-cobalt stone">Cobalt</span>
    <span class="pebble sg-amber stone">Amber</span>
    <span class="pebble sg-lavender stone">Lavender</span>
    <span class="pebble sg-coral stone">Coral</span>
  </div>
  <div class="glass card">
    <span class="badge badge-info" style="justify-self:start">Frosted panel</span>
    <h2>Found on the shore</h2>
    <p>Panels are clear frosted glass. The pebbles inside them carry the color.</p>
    <div class="row"><button class="btn btn-primary">Read the guide</button><button class="btn">Preview</button></div>
  </div>
</div>
</body>
</html>
