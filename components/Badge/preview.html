<!-- @dsCard group="Feedback" height=220 subtitle="Status badges and filter chips" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=DM+Mono&display=swap">
<style>
  body { margin: 0; }
  .stage { box-sizing: border-box; min-height: 100dvh; padding: 32px; }
  .stage { display: grid; gap: 22px; align-content: center; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
</style>
</head>
<body>
<div class="shore stage">
  <div class="row">
    <span class="badge badge-success">Live</span>
    <span class="badge badge-warning">Draft</span>
    <span class="badge badge-danger">Build failed</span>
    <span class="badge badge-info">Shared</span>
    <span class="badge">Archived</span>
    <span class="badge sg-lavender">Side project</span>
  </div>
  <div class="row">
    <button class="chip" aria-pressed="true">All</button>
    <button class="chip" aria-pressed="false">Apps</button>
    <button class="chip" aria-pressed="false">Writing</button>
    <button class="chip" aria-pressed="false">Photography</button>
  </div>
</div>
</body>
</html>
